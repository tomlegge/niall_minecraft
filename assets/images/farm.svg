<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" shape-rendering="crispEdges">
  <!-- sky -->
  <rect width="320" height="200" fill="#7fb6ff"/>
  <!-- clouds -->
  <g fill="#fff">
    <rect x="40" y="30" width="40" height="10"/>
    <rect x="50" y="24" width="24" height="6"/>
    <rect x="220" y="50" width="50" height="10"/>
    <rect x="234" y="44" width="30" height="6"/>
  </g>
  <!-- ground -->
  <rect y="120" width="320" height="80" fill="#7cbf41"/>
  <rect y="132" width="320" height="68" fill="#8a5a3b"/>
  <!-- water canal -->
  <rect x="156" y="132" width="8" height="68" fill="#3a82d6"/>
  <rect x="156" y="132" width="8" height="3" fill="#5da4f0"/>
  <!-- wheat rows -->
  <g>
    <!-- left field -->
    <g fill="#a87a44"><rect x="20" y="138" width="120" height="56"/></g>
    <g fill="#f5c542">
      <rect x="24" y="142" width="3" height="14"/><rect x="34" y="142" width="3" height="14"/>
      <rect x="44" y="142" width="3" height="14"/><rect x="54" y="142" width="3" height="14"/>
      <rect x="64" y="142" width="3" height="14"/><rect x="74" y="142" width="3" height="14"/>
      <rect x="84" y="142" width="3" height="14"/><rect x="94" y="142" width="3" height="14"/>
      <rect x="104" y="142" width="3" height="14"/><rect x="114" y="142" width="3" height="14"/>
      <rect x="124" y="142" width="3" height="14"/><rect x="134" y="142" width="3" height="14"/>
      <rect x="24" y="166" width="3" height="14"/><rect x="34" y="166" width="3" height="14"/>
      <rect x="44" y="166" width="3" height="14"/><rect x="54" y="166" width="3" height="14"/>
      <rect x="64" y="166" width="3" height="14"/><rect x="74" y="166" width="3" height="14"/>
      <rect x="84" y="166" width="3" height="14"/><rect x="94" y="166" width="3" height="14"/>
      <rect x="104" y="166" width="3" height="14"/><rect x="114" y="166" width="3" height="14"/>
      <rect x="124" y="166" width="3" height="14"/><rect x="134" y="166" width="3" height="14"/>
    </g>
  </g>
  <g>
    <!-- right field carrots -->
    <g fill="#a87a44"><rect x="180" y="138" width="120" height="56"/></g>
    <g fill="#5d8b2f">
      <rect x="186" y="138" width="6" height="10"/><rect x="200" y="138" width="6" height="10"/>
      <rect x="214" y="138" width="6" height="10"/><rect x="228" y="138" width="6" height="10"/>
      <rect x="242" y="138" width="6" height="10"/><rect x="256" y="138" width="6" height="10"/>
      <rect x="270" y="138" width="6" height="10"/><rect x="284" y="138" width="6" height="10"/>
      <rect x="186" y="162" width="6" height="10"/><rect x="200" y="162" width="6" height="10"/>
      <rect x="214" y="162" width="6" height="10"/><rect x="228" y="162" width="6" height="10"/>
      <rect x="242" y="162" width="6" height="10"/><rect x="256" y="162" width="6" height="10"/>
      <rect x="270" y="162" width="6" height="10"/><rect x="284" y="162" width="6" height="10"/>
