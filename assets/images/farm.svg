  <!-- scarecrow -->
  <rect x="150" y="92" width="4" height="28" fill="#5d3a22"/>
  <rect x="138" y="100" width="28" height="4" fill="#5d3a22"/>
  <rect x="144" y="86" width="16" height="14" fill="#a87a44"/>
  <rect x="146" y="90" width="2" height="2" fill="#000"/>
  <rect x="156" y="90" width="2" height="2" fill="#000"/>
  <rect x="148" y="94" width="8" height="2" fill="#000"/>
