<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" shape-rendering="crispEdges">
  <!-- sky -->
  <rect width="320" height="200" fill="#7fb6ff"/>
  <rect width="320" height="40" fill="#a5cdff"/>
  <!-- ground -->
  <rect y="150" width="320" height="50" fill="#7cbf41"/>
  <rect y="162" width="320" height="38" fill="#8a5a3b"/>
  <!-- path -->
  <rect x="140" y="150" width="40" height="50" fill="#a9a9a9"/>
  <rect x="140" y="150" width="40" height="3" fill="#888"/>
  <!-- tree -->
  <rect x="40" y="110" width="6" height="40" fill="#5d3a22"/>
  <rect x="20" y="80" width="46" height="40" fill="#3a7a2f"/>
  <rect x="14" y="90" width="60" height="22" fill="#3a7a2f"/>
  <rect x="20" y="80" width="46" height="4" fill="#2d5e24"/>
  <!-- house body -->
  <rect x="80" y="90" width="180" height="60" fill="#a87a44"/>
  <g fill="#7a5832">
    <rect x="80" y="90" width="180" height="4"/>
    <rect x="80" y="110" width="180" height="2"/>
    <rect x="80" y="130" width="180" height="2"/>
    <rect x="80" y="148" width="180" height="2"/>
    <rect x="120" y="94" width="2" height="16"/>
    <rect x="180" y="94" width="2" height="16"/>
    <rect x="240" y="94" width="2" height="16"/>
    <rect x="100" y="112" width="2" height="18"/>
    <rect x="160" y="112" width="2" height="18"/>
    <rect x="220" y="112" width="2" height="18"/>
    <rect x="120" y="132" width="2" height="16"/>
    <rect x="220" y="132" width="2" height="16"/>
  </g>
  <!-- roof -->
  <polygon points="76,90 264,90 240,60 100,60" fill="#7a3a2a"/>
  <polygon points="76,90 100,60 100,90" fill="#5d2818"/>
  <polygon points="240,60 264,90 240,90" fill="#5d2818"/>
  <g fill="#5d2818">
    <rect x="100" y="68" width="140" height="2"/>
    <rect x="100" y="78" width="140" height="2"/>
  </g>
  <!-- door -->
  <rect x="150" y="120" width="20" height="30" fill="#5d3a22"/>
  <rect x="150" y="120" width="20" height="4" fill="#3a2414"/>
  <rect x="160" y="120" width="2" height="30" fill="#3a2414"/>
  <rect x="165" y="135" width="2" height="2" fill="#f5c542"/>
  <!-- windows -->
  <rect x="100" y="105" width="24" height="20" fill="#7fb6ff"/>
  <rect x="100" y="105" width="24" height="3" fill="#a5cdff"/>
  <rect x="110" y="105" width="2" height="20" fill="#5d3a22"/>
  <rect x="100" y="113" width="24" height="2" fill="#5d3a22"/>
  <rect x="216" y="105" width="24" height="20" fill="#7fb6ff"/>
  <rect x="216" y="105" width="24" height="3" fill="#a5cdff"/>
  <rect x="226" y="105" width="2" height="20" fill="#5d3a22"/>
  <rect x="216" y="113" width="24" height="2" fill="#5d3a22"/>
  <!-- chimney smoke -->
  <rect x="200" y="40" width="14" height="20" fill="#a9a9a9"/>
  <g fill="#fff" opacity="0.7">
    <rect x="204" y="20" width="8" height="8"/>
    <rect x="210" y="10" width="10" height="8"/>
  </g>
</svg>
