<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" shape-rendering="crispEdges">
  <rect width="320" height="200" fill="#7fb6ff"/>
  <rect width="320" height="44" fill="#a5cdff"/>
  <!-- ocean -->
  <rect y="130" width="320" height="70" fill="#3a82d6"/>
  <g fill="#5da4f0">
    <rect y="130" width="320" height="3"/>
    <rect y="146" width="320" height="2"/>
    <rect y="164" width="320" height="2"/>
    <rect y="182" width="320" height="2"/>
  </g>
  <!-- island -->
  <rect x="100" y="120" width="120" height="20" fill="#f5c542"/>
  <rect x="120" y="116" width="80" height="6" fill="#7cbf41"/>
  <!-- bridge piers -->
  <g fill="#5d3a22">
    <rect x="40" y="90" width="8" height="60"/>
    <rect x="100" y="90" width="8" height="60"/>
    <rect x="220" y="90" width="8" height="60"/>
    <rect x="280" y="90" width="8" height="60"/>
  </g>
  <!-- bridge deck -->
  <rect x="20" y="84" width="280" height="10" fill="#a87a44"/>
  <rect x="20" y="84" width="280" height="2" fill="#7a5832"/>
  <!-- rails -->
  <g fill="#7a5832">
    <rect x="20" y="72" width="280" height="3"/>
    <rect x="40" y="74" width="3" height="10"/>
    <rect x="80" y="74" width="3" height="10"/>
    <rect x="120" y="74" width="3" height="10"/>
    <rect x="160" y="74" width="3" height="10"/>
    <rect x="200" y="74" width="3" height="10"/>
    <rect x="240" y="74" width="3" height="10"/>
    <rect x="280" y="74" width="3" height="10"/>
  </g>
  <!-- lanterns -->
  <g>
    <rect x="38" y="62" width="7" height="10" fill="#f5c542"/>
    <rect x="158" y="62" width="7" height="10" fill="#f5c542"/>
    <rect x="278" y="62" width="7" height="10" fill="#f5c542"/>
  </g>
</svg>
