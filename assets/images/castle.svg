<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" shape-rendering="crispEdges">
  <!-- sky -->
  <rect width="320" height="200" fill="#7fb6ff"/>
  <rect width="320" height="40" fill="#a5cdff"/>
  <!-- sun -->
  <rect x="260" y="20" width="20" height="20" fill="#fff6a3"/>
  <rect x="256" y="24" width="28" height="12" fill="#fff6a3"/>
  <!-- ground -->
  <rect y="160" width="320" height="40" fill="#7cbf41"/>
  <rect y="172" width="320" height="28" fill="#8a5a3b"/>
  <!-- castle base -->
  <rect x="60" y="80" width="200" height="80" fill="#a9a9a9"/>
  <rect x="60" y="80" width="200" height="6" fill="#8a8a8a"/>
  <!-- bricks lines -->
  <g fill="#8a8a8a">
    <rect x="60" y="100" width="200" height="2"/>
    <rect x="60" y="120" width="200" height="2"/>
    <rect x="60" y="140" width="200" height="2"/>
    <rect x="100" y="86" width="2" height="14"/>
    <rect x="160" y="86" width="2" height="14"/>
    <rect x="220" y="86" width="2" height="14"/>
    <rect x="80" y="102" width="2" height="18"/>
    <rect x="140" y="102" width="2" height="18"/>
    <rect x="200" y="102" width="2" height="18"/>
    <rect x="240" y="102" width="2" height="18"/>
  </g>
  <!-- towers -->
  <rect x="40" y="50" width="40" height="110" fill="#a9a9a9"/>
  <rect x="240" y="50" width="40" height="110" fill="#a9a9a9"/>
  <!-- battlements -->
  <g fill="#a9a9a9">
    <rect x="40" y="40" width="10" height="10"/>
    <rect x="60" y="40" width="10" height="10"/>
    <rect x="240" y="40" width="10" height="10"/>
    <rect x="260" y="40" width="10" height="10"/>
    <rect x="70" y="70" width="10" height="10"/>
    <rect x="90" y="70" width="10" height="10"/>
    <rect x="110" y="70" width="10" height="10"/>
    <rect x="130" y="70" width="10" height="10"/>
    <rect x="150" y="70" width="10" height="10"/>
    <rect x="170" y="70" width="10" height="10"/>
    <rect x="190" y="70" width="10" height="10"/>
    <rect x="210" y="70" width="10" height="10"/>
    <rect x="230" y="70" width="10" height="10"/>
  </g>
  <!-- flags -->
  <rect x="58" y="20" width="2" height="20" fill="#222"/>
  <rect x="60" y="22" width="14" height="10" fill="#c8312a"/>
  <rect x="258" y="20" width="2" height="20" fill="#222"/>
  <rect x="260" y="22" width="14" height="10" fill="#c8312a"/>
  <!-- gate -->
  <rect x="145" y="120" width="30" height="40" fill="#5d3a22"/>
  <rect x="145" y="120" width="30" height="6" fill="#8a5a3b"/>
  <rect x="158" y="120" width="2" height="40" fill="#3a2414"/>
  <!-- windows -->
  <rect x="55" y="80" width="10" height="14" fill="#1a1a2e"/>
  <rect x="55" y="110" width="10" height="14" fill="#1a1a2e"/>
  <rect x="255" y="80" width="10" height="14" fill="#1a1a2e"/>
  <rect x="255" y="110" width="10" height="14" fill="#1a1a2e"/>
  <rect x="100" y="100" width="10" height="14" fill="#1a1a2e"/>
  <rect x="210" y="100" width="10" height="14" fill="#1a1a2e"/>
</svg>
