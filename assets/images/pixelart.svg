<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" shape-rendering="crispEdges">
  <rect width="320" height="200" fill="#1a1a2e"/>
  <!-- frame -->
  <rect x="10" y="10" width="300" height="180" fill="none" stroke="#7a5832" stroke-width="6"/>
  <!-- creeper face pixel art -->
  <g transform="translate(80,30)">
    <!-- background green -->
    <g fill="#5d8b2f">
      <rect width="160" height="140"/>
    </g>
    <g fill="#3a7a2f">
      <rect width="160" height="14"/>
      <rect y="126" width="160" height="14"/>
      <rect width="14" height="140"/>
      <rect x="146" width="14" height="140"/>
    </g>
    <!-- noise pixels -->
    <g fill="#7cbf41" opacity="0.7">
      <rect x="40" y="40" width="14" height="14"/>
      <rect x="80" y="60" width="14" height="14"/>
      <rect x="120" y="30" width="14" height="14"/>
      <rect x="60" y="100" width="14" height="14"/>
      <rect x="100" y="110" width="14" height="14"/>
    </g>
    <!-- eyes -->
    <rect x="40" y="40" width="24" height="24" fill="#000"/>
    <rect x="96" y="40" width="24" height="24" fill="#000"/>
    <!-- mouth -->
    <rect x="64" y="72" width="32" height="20" fill="#000"/>
    <rect x="56" y="80" width="16" height="16" fill="#000"/>
    <rect x="88" y="80" width="16" height="16" fill="#000"/>
    <rect x="64" y="92" width="14" height="14" fill="#000"/>
    <rect x="82" y="92" width="14" height="14" fill="#000"/>
  </g>
</svg>
